version: "3.9"
services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aprioriverde
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      # MONGO_URI puede apuntar a un Mongo local (por defecto) o a MongoDB Atlas.
      # Para usar Atlas, define MONGO_URI en el archivo .env o como variable de entorno
      # Ejemplo (env): MONGO_URI=mongodb+srv://user:pass@cluster.mongodb.net/product_portal
      # El valor por defecto apunta al servicio `mongo` definido en este compose.
      MONGO_URI: mongodb+srv://bryan-baquedano:Bry123456789@cluster0.b2r1gxg.mongodb.net/product_portal?retryWrites=true&w=majority&appName=Cluster0
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    # Volumen opcional para desarrollo (comentar en producción):
    # volumes:
    #   - ./src:/app/src

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
